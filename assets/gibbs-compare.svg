<title id="gibbs-compare-title">Gibbs vs llama.cpp on Apple Silicon</title>
<desc id="gibbs-compare-desc">Two bar charts. A: decode speed on Apple M5 Pro with the same GGUF files, as percent of the Gibbs roofline: Gemma 4 E2B QAT · UD-Q2_K_XL Gibbs 150.1 tok/s (43.8%), llama.cpp 150.7 tok/s (44.0%); Gemma 4 E2B · Q4_K_M Gibbs 107.4 tok/s (55.2%), llama.cpp 121.8 tok/s (62.6%); Qwen3.5 2B · UD-Q4_K_XL Gibbs 113.7 tok/s (52.7%), llama.cpp 148.3 tok/s (68.7%); Qwen3.5 9B (DavidAU MTP) · IQ2_M Gibbs 41.3 tok/s (64.7%), llama.cpp 43.2 tok/s (67.7%); Llama 3.2 1B · Q4_0 Gibbs 254.0 tok/s (67.7%), llama.cpp 269.0 tok/s (71.7%). B: bytes per token times tok/s as percent of Apple's 307 GB/s spec for Apple M5 Pro, 16-core GPU: llama.cpp Llama 2 7B · F16 · 13.48 GB 93.9%; Llama 2 7B · Q8_0 · 7.16 GB 90.8%; Llama 2 7B · Q4_0 · 3.79 GB 83.4%; Qwen3.5 9B (DavidAU MTP) · IQ2_M · 4.49 GB 60.5%; Gemma 4 26B-A4B · UD-IQ2_XXS · 2.18 GB 51.3%; Gemma 4 E2B · Q4_K_M · 1.47 GB 51.6%; Qwen3.5 2B · UD-Q4_K_XL · 1.33 GB 49.2%; Gemma 4 E2B QAT · UD-Q2_K_XL · 0.84 GB 41.0%; Gemma 4 E2B QAT · 4k context · 0.84 GB 34.1%; Llama 3.2 1B · bnb 4-bit · 0.77 GB 56.1%; Llama 3.2 1B · Q4_0 · 0.76 GB 63.3%; SmolLM2 135M · safetensors · 0.27 GB 41.0%.</desc>

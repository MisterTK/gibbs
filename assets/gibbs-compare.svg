<title id="gibbs-compare-title">Gibbs vs llama.cpp on Apple Silicon</title>
<desc id="gibbs-compare-desc">Two bar charts. A: decode speed on Apple M5 Pro with the same GGUF files, as percent of the Gibbs roofline: Gemma 4 E2B QAT · UD-Q2_K_XL Gibbs 143.3 tok/s (41.0%), llama.cpp 145.1 tok/s (41.5%); Gemma 4 E2B · Q4_K_M Gibbs 105.9 tok/s (53.4%), llama.cpp 115.7 tok/s (58.3%); Qwen3.5 2B · UD-Q4_K_XL Gibbs 135.8 tok/s (60.3%), llama.cpp 143.8 tok/s (63.9%); Qwen3.5 9B (DavidAU MTP) · IQ2_M Gibbs 40.4 tok/s (62.0%), llama.cpp 42.6 tok/s (65.4%); Llama 3.2 1B · Q4_0 Gibbs 248.1 tok/s (64.8%), llama.cpp 260.2 tok/s (68.0%); Gemma 4 26B-A4B · UD-IQ2_XXS Gibbs 71.3 tok/s (53.1%), llama.cpp 80.9 tok/s (60.2%). B: bytes per token times tok/s as percent of Apple's 307 GB/s spec for Apple M5 Pro, 16-core GPU: llama.cpp Llama 2 7B · F16 · 13.48 GB 93.9%; Llama 2 7B · Q8_0 · 7.16 GB 90.8%; Llama 2 7B · Q4_0 · 3.79 GB 83.4%; Qwen3.5 9B (DavidAU MTP) · IQ2_M · 4.49 GB 59.2%; Gemma 4 26B-A4B · UD-IQ2_XXS · 2.18 GB 50.6%; Gemma 4 E2B · Q4_K_M · 1.47 GB 50.9%; Qwen3.5 2B · UD-Q4_K_XL · 1.30 GB 57.5%; Gemma 4 E2B QAT · UD-Q2_K_XL · 0.84 GB 39.1%; Gemma 4 E2B QAT · 4k context · 0.84 GB 32.7%; Llama 3.2 1B · bnb 4-bit · 0.77 GB 55.4%; Llama 3.2 1B · Q4_0 · 0.76 GB 61.8%; SmolLM2 135M · safetensors · 0.27 GB 40.2%.</desc>

<text x="48" y="504" font-size="14" fill="#F5EEDB">Gemma 4 E2B QAT · 4k context</text><rect x="360" y="490" width="600" height="16" fill="#1B1510" stroke="#7A6040" stroke-width="1"/><rect x="360" y="490" width="209" height="16" fill="#FF8C00"/><text x="984" y="504" font-size="14" fill="#F5EEDB">123 tok/s</text><text x="1152" y="504" font-size="14" text-anchor="end" fill="#FF8C00">34.9%</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-labelledby="gibbs-roofline-title gibbs-roofline-desc">
<title id="gibbs-roofline-title">Gibbs decode speed vs memory-bandwidth roofline</title>
<desc id="gibbs-roofline-desc">Bar chart of median decode speed as a percent of the measured memory-bandwidth roofline on Apple M5 Pro, build b7269ae: Gemma 4 E2B QAT · UD-Q2_K_XL 143 tok/s 41.0%; Gemma 4 E2B · Q4_K_M 106 tok/s 53.4%; Qwen3.5 2B · UD-Q4_K_XL 125 tok/s 55.5%; Qwen3.5 9B (DavidAU MTP) · IQ2_M 40 tok/s 62.0%; Llama 3.2 1B · Q4_0 248 tok/s 64.8%; SmolLM2 135M · safetensors 459 tok/s 42.2%; Llama 3.2 1B · bnb 4-bit 222 tok/s 58.1%; Gemma 4 26B-A4B · UD-IQ2_XXS 71 tok/s 53.1%; Gemma 4 E2B QAT · 4k context 120 tok/s 34.2%; geomean 50.6%.</desc>
<style>text{font-family:'SF Mono','Menlo','DejaVu Sans Mono',monospace}.serif{font-family:'Bodoni 72','Didot','Playfair Display','Bodoni MT',Georgia,'Times New Roman',serif}</style>
<rect width="1200" height="600" rx="14" fill="#14100D"/>
<rect x="1" y="1" width="1198" height="598" rx="13" fill="none" stroke="#7A6040" stroke-width="2"/>
<rect x="6" y="6" width="1188" height="588" rx="9" fill="none" stroke="#7A6040" stroke-width="1"/>
<g fill="#D4AF37"><rect x="10" y="10" width="4" height="4"/><rect x="1186" y="10" width="4" height="4"/><rect x="10" y="586" width="4" height="4"/><rect x="1186" y="586" width="4" height="4"/></g>
<text x="48" y="56" font-size="12" fill="#A8895F" letter-spacing="0.12em">DECODE SPEED · PERCENT OF MEMORY-BANDWIDTH ROOFLINE</text>
<text class="serif" x="48" y="96" font-size="28" fill="#F5EEDB">50.6% geomean across 9 models</text>
<text x="48" y="124" font-size="12" fill="#A8895F">APPLE M5 PRO · METAL · CEILING 293 GB/S · BUILD B7269AE · 2026-10-20 · 128 TOKENS × 3 RUNS, MEDIAN · ONE GIBBS --BENCH PROCESS PER BENCH/LOOP.JSON ROW (SUITE DEFAULTS: 128 TOKENS, 3 RUNS)</text>
<text x="48" y="184" font-size="14" fill="#F5EEDB">Gemma 4 E2B QAT · UD-Q2_K_XL</text><rect x="360" y="170" width="600" height="16" fill="#1B1510" stroke="#7A6040" stroke-width="1"/><rect x="360" y="170" width="246" height="16" fill="#FF8C00"/><text x="984" y="184" font-size="14" fill="#F5EEDB">143 tok/s</text><text x="1152" y="184" font-size="14" text-anchor="end" fill="#FF8C00">41.0%</text>

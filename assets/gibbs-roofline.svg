<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-labelledby="gibbs-roofline-title gibbs-roofline-desc">
<title id="gibbs-roofline-title">Gibbs decode speed vs memory-bandwidth roofline</title>
<desc id="gibbs-roofline-desc">Bar chart of median decode speed as a percent of the measured memory-bandwidth roofline on Apple M5 Pro, build a701ad7: Gemma 4 E2B QAT · UD-Q2_K_XL 137 tok/s 38.8%; Gemma 4 E2B · Q4_K_M 105 tok/s 52.7%; Qwen3.5 2B · UD-Q4_K_XL 112 tok/s 49.0%; Qwen3.5 9B (DavidAU MTP) · IQ2_M 38 tok/s 58.4%; Llama 3.2 1B · Q4_0 249 tok/s 64.5%; SmolLM2 135M · safetensors 423 tok/s 38.6%; Llama 3.2 1B · bnb 4-bit 225 tok/s 58.4%; Gemma 4 26B-A4B · UD-IQ2_XXS 69 tok/s 51.2%; Gemma 4 E2B QAT · 4k context 123 tok/s 34.9%; geomean 48.6%.</desc>
<style>text{font-family:'SF Mono','Menlo','DejaVu Sans Mono',monospace}.serif{font-family:'Bodoni 72','Didot','Playfair Display','Bodoni MT',Georgia,'Times New Roman',serif}</style>
<rect width="1200" height="600" rx="14" fill="#14100D"/>
<rect x="1" y="1" width="1198" height="598" rx="13" fill="none" stroke="#7A6040" stroke-width="2"/>
<rect x="6" y="6" width="1188" height="588" rx="9" fill="none" stroke="#7A6040" stroke-width="1"/>
<g fill="#D4AF37"><rect x="10" y="10" width="4" height="4"/><rect x="1186" y="10" width="4" height="4"/><rect x="10" y="586" width="4" height="4"/><rect x="1186" y="586" width="4" height="4"/></g>
<text x="48" y="56" font-size="12" fill="#A8895F" letter-spacing="0.12em">DECODE SPEED · PERCENT OF MEMORY-BANDWIDTH ROOFLINE</text>
<text class="serif" x="48" y="96" font-size="28" fill="#F5EEDB">48.6% geomean across 9 models</text>
<text x="48" y="124" font-size="12" fill="#A8895F">APPLE M5 PRO · METAL · CEILING 295 GB/S · BUILD A701AD7 · 2026-10-16 · 128 TOKENS × 3 RUNS, MEDIAN</text>
<text x="48" y="184" font-size="14" fill="#F5EEDB">Gemma 4 E2B QAT · UD-Q2_K_XL</text><rect x="360" y="170" width="600" height="16" fill="#1B1510" stroke="#7A6040" stroke-width="1"/><rect x="360" y="170" width="233" height="16" fill="#FF8C00"/><text x="984" y="184" font-size="14" fill="#F5EEDB">137 tok/s</text><text x="1152" y="184" font-size="14" text-anchor="end" fill="#FF8C00">38.8%</text>
<text x="48" y="224" font-size="14" fill="#F5EEDB">Gemma 4 E2B · Q4_K_M</text><rect x="360" y="210" width="600" height="16" fill="#1B1510" stroke="#7A6040" stroke-width="1"/><rect x="360" y="210" width="316" height="16" fill="#FF8C00"/><text x="984" y="224" font-size="14" fill="#F5EEDB">105 tok/s</text><text x="1152" y="224" font-size="14" text-anchor="end" fill="#FF8C00">52.7%</text>

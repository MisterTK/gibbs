<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" width="100%" height="auto" role="img" aria-labelledby="maxwell-banner-title maxwell-banner-desc">
  <title id="maxwell-banner-title">The Maxwell-Gibbs 1873 Thermodynamic Surface Banner</title>
  <desc id="maxwell-banner-desc">Architectural vector banner showing James Clerk Maxwell's 1873 thermodynamic plaster surface in Volume-Entropy-Energy space with Gibbs engine typography.</desc>
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14100D" />
      <stop offset="60%" stop-color="#1B1410" />
      <stop offset="100%" stop-color="#241B15" />
    </linearGradient>
    <linearGradient id="brass-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8C6D46" />
      <stop offset="35%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#F5EEDB" />
      <stop offset="85%" stop-color="#E5C158" />
      <stop offset="100%" stop-color="#8C6D46" />
    </linearGradient>
    <linearGradient id="surface-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5EEDB" stop-opacity="0.12" />
      <stop offset="50%" stop-color="#D4AF37" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#8C6D46" stop-opacity="0.02" />
    </linearGradient>
    <style>
      .brass-title {
        font-family: 'Times New Roman', Georgia, 'Instrument Serif', serif;
        font-weight: bold;
        letter-spacing: 0.18em;
      }
      .victorian-sub {
        font-family: 'Times New Roman', Georgia, serif;
        letter-spacing: 0.22em;
        font-style: italic;
      }
      .mono-math {
        font-family: 'Courier New', 'Geist Mono', monospace;
      }
    </style>
  </defs>

  <!-- Deep Obsidian Slate Background -->
  <rect width="960" height="280" fill="url(#bg-grad)" rx="8" />

  <!-- Victorian Machined Double Brass Outer Border -->
  <rect x="8" y="8" width="944" height="264" rx="6" fill="none" stroke="#D4AF37" stroke-width="2" />
  <rect x="13" y="13" width="934" height="254" rx="4" fill="none" stroke="#8C6D46" stroke-width="0.8" />

  <!-- Corner Brass Brackets -->
  <g fill="#D4AF37">
    <circle cx="16" cy="16" r="2.5" />
    <circle cx="944" cy="16" r="2.5" />
    <circle cx="16" cy="264" r="2.5" />
    <circle cx="944" cy="264" r="2.5" />
    <path d="M 14 32 L 32 14" stroke="#D4AF37" stroke-width="1.5" />
    <path d="M 946 32 L 928 14" stroke="#D4AF37" stroke-width="1.5" />
    <path d="M 14 248 L 32 266" stroke="#D4AF37" stroke-width="1.5" />
    <path d="M 946 248 L 928 266" stroke="#D4AF37" stroke-width="1.5" />
  </g>

  <!-- Left / Center-Left: 3D Maxwell Thermodynamic Surface (V, S, U Coordinates) -->
  <g id="maxwell-surface" transform="translate(48, 12)">
    <!-- Coordinate Origin & Axes -->
    <!-- U (Energy) Axis - Vertical -->
    <line x1="120" y1="210" x2="120" y2="40" stroke="#8C6D46" stroke-width="1.5" stroke-dasharray="3,3" />
    <polygon points="120,32 116,42 124,42" fill="#D4AF37" />
    <text x="110" y="36" fill="#D4AF37" class="mono-math" font-size="11" font-weight="bold">Energy U</text>

    <!-- V (Volume) Axis - Slanted Left-Down -->
    <line x1="120" y1="210" x2="30" y2="242" stroke="#8C6D46" stroke-width="1.5" stroke-dasharray="3,3" />
    <polygon points="24,244 34,238 36,246" fill="#D4AF37" />
    <text x="18" y="258" fill="#D4AF37" class="mono-math" font-size="11" font-weight="bold">Volume V</text>

    <!-- S (Entropy) Axis - Slanted Right-Down -->
    <line x1="120" y1="210" x2="270" y2="230" stroke="#8C6D46" stroke-width="1.5" stroke-dasharray="3,3" />
    <polygon points="278,231 268,226 268,235" fill="#D4AF37" />
    <text x="282" y="235" fill="#D4AF37" class="mono-math" font-size="11" font-weight="bold">Entropy S</text>

    <!-- Ruled Surface Manifold: Plaster Shading polygon -->
    <path d="M 70 170 Q 120 190 190 180 Q 250 150 280 110 Q 220 80 160 85 Q 100 95 70 170 Z" fill="url(#surface-fill)" stroke="#8C6D46" stroke-width="0.8" />

    <!-- Ruled Isotherms (Curves of constant T = ∂U/∂S) in Polished Brass -->
    <path d="M 70 170 Q 130 150 210 135 Q 260 120 280 110" fill="none" stroke="#D4AF37" stroke-width="1.6" />
    <path d="M 80 150 Q 140 132 215 118 Q 255 105 270 95" fill="none" stroke="#D4AF37" stroke-width="1.3" opacity="0.9" />
    <path d="M 90 130 Q 148 114 218 102 Q 250 90 260 82" fill="none" stroke="#D4AF37" stroke-width="1.1" opacity="0.75" />
    <path d="M 100 110 Q 155 98 220 86 Q 245 76 250 70" fill="none" stroke="#D4AF37" stroke-width="0.9" opacity="0.6" />

    <!-- Ruled Isobars (Curves of constant P = -∂U/∂V) in Maxwell Plaster Ivory -->
    <path d="M 70 170 Q 85 140 100 110" fill="none" stroke="#F5EEDB" stroke-width="1.2" opacity="0.8" />
    <path d="M 105 165 Q 120 135 135 105" fill="none" stroke="#F5EEDB" stroke-width="1.2" opacity="0.8" />
    <path d="M 145 160 Q 160 130 175 98" fill="none" stroke="#F5EEDB" stroke-width="1.2" opacity="0.8" />
    <path d="M 185 152 Q 200 122 215 90" fill="none" stroke="#F5EEDB" stroke-width="1.2" opacity="0.8" />
    <path d="M 230 140 Q 242 112 255 80" fill="none" stroke="#F5EEDB" stroke-width="1.2" opacity="0.8" />
    <path d="M 280 110 Q 275 95 265 72" fill="none" stroke="#F5EEDB" stroke-width="1.2" opacity="0.8" />

    <!-- Spinodal Curve & Critical Point in Crimson / Ember -->
    <path d="M 110 162 Q 170 148 225 125" fill="none" stroke="#C84646" stroke-width="1.8" stroke-dasharray="4,3" />
    <circle cx="225" cy="125" r="3.5" fill="#FF8C00" stroke="#F5EEDB" stroke-width="1" />
    <text x="232" y="124" fill="#FF8C00" class="mono-math" font-size="8.5">Critical Pt</text>

    <!-- Triple Point Line in Stable Jade -->
    <line x1="90" y1="168" x2="160" y2="155" stroke="#6B9E78" stroke-width="2" />
    <circle cx="125" cy="161" r="2.5" fill="#6B9E78" />
    <text x="110" y="178" fill="#6B9E78" class="mono-math" font-size="8">Triple Line ◆</text>

    <!-- Inscription Caption -->
    <text x="140" y="248" fill="#8C6D46" class="victorian-sub" font-size="9.5" text-anchor="middle">
      Maxwell's 1873 Plaster Thermodynamic Model (U = f(V, S))
    </text>
  </g>

  <!-- Vertical Dividing Brass Rod -->
  <line x1="390" y1="28" x2="390" y2="252" stroke="#8C6D46" stroke-width="1.2" />
  <circle cx="390" cy="140" r="3.5" fill="#D4AF37" />

  <!-- Right Side: Engine Typography & Foundations -->
  <g id="typography" transform="translate(425, 30)">
    <!-- Eyebrow Tag -->
    <text x="0" y="22" fill="#D4AF37" class="mono-math" font-size="10.5" letter-spacing="0.25em" font-weight="bold">
      EST. 1873 · YALE &amp; CAVENDISH FOUNDATIONS
    </text>

    <!-- Main Title: G I B B S -->
    <text x="0" y="80" fill="url(#brass-grad)" class="brass-title" font-size="54">
      G I B B S
    </text>

    <!-- Subtitle -->
    <text x="2" y="106" fill="#F5EEDB" class="victorian-sub" font-size="13">
      THERMODYNAMIC INFERENCE ENGINE &amp; UNIVERSAL JIT COMPILER
    </text>

    <line x1="2" y1="118" x2="490" y2="118" stroke="#8C6D46" stroke-width="1" />

    <!-- Core Tenets & Vector Formula Box -->
    <g transform="translate(2, 130)">
      <!-- Left Block: Thermodynamic Equations -->
      <text x="0" y="16" fill="#E5C158" class="mono-math" font-size="11.5" font-weight="bold">
        dU = T dS − P dV + Σ μᵢ dnᵢ
      </text>
      <text x="0" y="36" fill="#A58C6E" class="mono-math" font-size="10">
        u × v = −v × u  ·  ∇ · (∇ × A) = 0  ·  u ⊗ v
      </text>
      <text x="0" y="56" fill="#6B9E78" class="mono-math" font-size="10">
        Trajectory: Irreversible Free-Energy Relaxation (dG ≤ 0)
      </text>
      <text x="0" y="76" fill="#F5EEDB" class="mono-math" font-size="10" opacity="0.85">
        Substrates: Apple Metal · NVIDIA CUDA · AMD ROCm · CPU SIMD
      </text>
    </g>

    <!-- Right Badge / Quote -->
    <g transform="translate(350, 134)">
      <rect x="0" y="0" width="144" height="66" rx="4" fill="#14100D" stroke="#8C6D46" stroke-width="0.8" />
      <text x="72" y="20" fill="#D4AF37" class="victorian-sub" font-size="9" text-anchor="middle">
        "The whole is simpler
      </text>
      <text x="72" y="34" fill="#D4AF37" class="victorian-sub" font-size="9" text-anchor="middle">
        than the sum of its parts."
      </text>
      <text x="72" y="52" fill="#8C6D46" class="victorian-sub" font-size="8" text-anchor="middle">
        — J. Willard Gibbs
      </text>
    </g>
  </g>
</svg>
